# ft-023: electron-builder config (CUDA bundle, self-use).
#
# Run from the `electron/` directory:
#
#     npm run build:all     # build sidecar (PyInstaller) + Electron installer
#
# Layout assumptions:
#   * `electron/dist-electron/`  — tsc output (main.js, preload.js, sidecar.js, …)
#   * `electron/resources/`      — placeholder.html (replaced by Vite build in ft-024)
#   * `<repo>/dist/explore-os-sidecar/`  — PyInstaller one-folder bundle,
#                                          copied to `<app>/resources/sidecar/`.

appId: dev.explore-os.app
productName: explore-os

directories:
  output: dist
  buildResources: build

# Files packed into the asar / app dir.
# (parent-relative globs like ../frontend/dist are silently dropped from `files`;
#  the frontend SPA goes into `extraResources` below and is loaded via
#  `process.resourcesPath` from main.ts.)
files:
  - dist-electron/**/*
  - resources/**/*
  - package.json

# PyInstaller bundle + frontend SPA — copied verbatim under <app>/resources/.
extraResources:
  - from: ../dist/explore-os-sidecar
    to: sidecar
    filter:
      - "**/*"
  - from: ../frontend/dist
    to: frontend
    filter:
      - "**/*"

asar: true
# Skip native rebuild — we have no native node deps yet.
nodeGypRebuild: false
buildDependenciesFromSource: false

mac:
  # ft-037: zip 形态是 portable（解压即跑，不写 /Applications）
  target:
    - dmg
    - zip
  identity: null            # self-use stage: no signing
  category: public.app-category.productivity
  icon: build/icons/icon.icns

win:
  # ft-037: portable 与 nsis 并存。
  # - nsis: 写 Program Files / 注册表，正常安装
  # - portable: 单文件自解压 exe，双击即跑（PORTABLE_EXECUTABLE_DIR 自动注入）
  target:
    - nsis
    - portable
  icon: build/icons/icon.ico
  signingHashAlgorithms: null  # self-use stage: no signing

# ft-037: portable target 的 exe 命名（默认会带 portable 后缀，显式标注更清晰）
portable:
  artifactName: "${productName}-${version}-portable.${ext}"

linux:
  target:
    - AppImage
  category: Utility
  icon: build/icons

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
