[project]
name = "explore-os"
version = "0.1.0"
description = "订阅驱动的信息检索推送助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "tenacity>=9.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "docling>=2.91.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "tests_*.py", "*_tests.py"]
