services:
  postgres:
    image: postgres:16-alpine
    container_name: explore-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: explore
      POSTGRES_PASSWORD: explore
      POSTGRES_DB: explore_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explore -d explore_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
